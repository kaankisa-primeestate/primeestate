name: Check Prisma Production Migration Status

on:
  push:
    branches:
      - main
    paths:
      - "web/prisma/**"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/prisma-production-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check production migration status
        env:
          DATABASE_URL: ${{ secrets.PRIMEESTATE_PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate status
