name: PrimeEstate Critical Tests

on:
  pull_request:
    paths:
      - "web/**"
      - "prisma/**"
      - "CURRENT_STATE.md"
      - "FOUNDATION_RECOVERY_PLAN.md"
      - ".github/workflows/primeestate-critical-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  critical-tests:
    name: Critical Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primeestate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d primeestate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/primeestate_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/primeestate_shadow?schema=public
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run critical test suite
        run: npm test

      - name: Publish failure output to PR
        if: failure()
        uses: actions/github-script@v7
        env:
          TEST_LOG_PATH: /tmp/primeestate-critical-tests.log
        with:
          script: |
            const fs = require("fs");
            const log = fs.existsSync(process.env.TEST_LOG_PATH)
              ? fs.readFileSync(process.env.TEST_LOG_PATH, "utf8")
              : "No test log file was produced.";
            const lines = log.split("\n");
            const tail = lines.slice(-220).join("\n");
            const body = [
              "### PrimeEstate CI diagnostic",
              "",
              "Run: ${{ github.run_id }}",
              "",
              "~~~text",
              tail.slice(-12000),
              "~~~",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
