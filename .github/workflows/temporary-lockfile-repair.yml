name: Temporary Lockfile Repair

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --force
      - name: Show lockfile root
        run: node -e "const p=require('./package-lock.json'); console.log(JSON.stringify(p.packages[''],null,2))"
      - name: Commit lockfile
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
