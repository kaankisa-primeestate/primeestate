name: Foundation State Validation

on:
  push:
    branches:
      - main
    paths:
      - "CURRENT_STATE.md"
      - "PROJECT_STATE.md"
      - "FOUNDATION_RECOVERY_PLAN.md"
      - ".github/workflows/foundation-state-validation.yml"
  pull_request:
    paths:
      - "CURRENT_STATE.md"
      - "PROJECT_STATE.md"
      - "FOUNDATION_RECOVERY_PLAN.md"
      - ".github/workflows/foundation-state-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate foundation state
        shell: bash
        run: |
          set -euo pipefail

          test -f CURRENT_STATE.md
          test -f PROJECT_STATE.md
          test -f FOUNDATION_RECOVERY_PLAN.md
          test -f docs/CURRENT_STATE.md

          grep -Fq "Phase 12 — Product Development / Core Workflow Experience" PROJECT_STATE.md
          grep -Fq "Active phase: **Phase 12 — Product Development / Core Workflow Experience**" CURRENT_STATE.md
          grep -Fq "customer → demand → matching" PROJECT_STATE.md
          grep -Fq "Foundation release gate: closed" CURRENT_STATE.md
          grep -Fq "TEK VERİ, ÇOK FONKSİYON" CURRENT_STATE.md

          echo "Foundation state validation passed."
