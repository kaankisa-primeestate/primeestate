name: Foundation State Validation

on:
  pull_request:
    paths:
      - "CURRENT_STATE.md"
      - "FOUNDATION_RECOVERY_PLAN.md"
      - ".github/workflows/foundation-state-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate foundation state
        shell: bash
        run: |
          set -euo pipefail

          test -f CURRENT_STATE.md
          test -f FOUNDATION_RECOVERY_PLAN.md

          grep -Fq "Phase 5 — Runtime & Route Protection" CURRENT_STATE.md
          grep -Fq "**Phase 7 — Dashboard / Finance live verification**" CURRENT_STATE.md
          grep -Fq "Phase 5 — Runtime & route protection — COMPLETE" FOUNDATION_RECOVERY_PLAN.md
          grep -Fq "## Phase 7 — Critical E2E business chain" FOUNDATION_RECOVERY_PLAN.md
          grep -Fq "Create/validate a clean current-main Dashboard/Finance branch." FOUNDATION_RECOVERY_PLAN.md

          echo "Foundation state validation passed."
