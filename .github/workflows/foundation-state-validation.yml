name: Foundation State Validation

on:
  pull_request:
    paths:
      - "CURRENT_STATE.md"
      - "FOUNDATION_RECOVERY_PLAN.md"
      - ".github/workflows/foundation-state-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate foundation state
        shell: bash
        run: |
          set -euo pipefail

          test -f CURRENT_STATE.md
          test -f FOUNDATION_RECOVERY_PLAN.md

          grep -Fq "Phase 5 — Runtime & Route Protection" CURRENT_STATE.md
          grep -Fq "**Phase 9 — Release Gate / next feature-development baseline**" CURRENT_STATE.md
          grep -Fq "Phase 5 — Runtime & route protection — COMPLETE" FOUNDATION_RECOVERY_PLAN.md
          grep -Fq "## Phase 7 — Critical E2E business chain" FOUNDATION_RECOVERY_PLAN.md
          grep -Fq "## Phase 8 — Codebase cleanup & documentation" FOUNDATION_RECOVERY_PLAN.md
          grep -Fq "2da8953f06304e6a2b6f049571a2df991b1e61e9" CURRENT_STATE.md
          grep -Fq "PR #88 — production release-gate smoke hardening — merged
          grep -Fq "PR #90 — Phase 9 release-gate baseline — merged" CURRENT_STATE.md" CURRENT_STATE.md
          grep -Fq "Phase 8 cleanup: complete" docs/CURRENT_STATE.md

          echo "Foundation state validation passed."
