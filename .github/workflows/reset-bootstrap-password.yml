name: Reset PrimeEstate Bootstrap Password

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-password:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Reset and verify bootstrap password
        env:
          DATABASE_URL: ${{ secrets.PRIMEESTATE_STAGING_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.PRIMEESTATE_BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: https://primeestate-v9e0.onrender.com
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.PRIMEESTATE_BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.PRIMEESTATE_BOOTSTRAP_ADMIN_PASSWORD }}
        run: npx --yes tsx@4.20.6 scripts/reset-bootstrap-password.ts
