name: PrimeEstate Production Auth HTTP Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Wait for Render to deploy this commit
        env:
          AUTH_SMOKE_BASE_URL: https://primeestate-v9eo.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node <<'NODE'
          const baseUrl = process.env.AUTH_SMOKE_BASE_URL.replace(/\/$/, "");
          const expected = process.env.EXPECTED_COMMIT;
          const deadline = Date.now() + 10 * 60 * 1000;

          while (Date.now() < deadline) {
            try {
              const response = await fetch(`${baseUrl}/api/deployment-check`, {
                headers: { Accept: "application/json" },
              });
              const body = await response.json().catch(() => null);
              const commit = body?.renderGitCommit ?? null;

              console.log(JSON.stringify({
                status: response.status,
                liveCommit: commit,
                expectedCommit: expected,
              }));

              if (response.ok && commit === expected) {
                process.exit(0);
              }
            } catch (error) {
              console.log(`deployment-check unavailable: ${error instanceof Error ? error.message : String(error)}`);
            }

            await new Promise((resolve) => setTimeout(resolve, 15000));
          }

          console.error(`Render did not expose expected commit ${expected} within 10 minutes.`);
          process.exit(1);
          NODE

      - name: Test production login, session and customer authorization
        env:
          AUTH_SMOKE_BASE_URL: https://primeestate-v9eo.onrender.com
          AUTH_SMOKE_EMAIL: ${{ secrets.PRIMEESTATE_BOOTSTRAP_ADMIN_EMAIL }}
          AUTH_SMOKE_PASSWORD: ${{ secrets.PRIMEESTATE_BOOTSTRAP_ADMIN_PASSWORD }}
        run: node scripts/production-auth-smoke.mjs
