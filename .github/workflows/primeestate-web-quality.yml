name: PrimeEstate Web Quality

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/primeestate-web-quality.yml"
      - ".github/workflows/production-auth-smoke.yml"
  pull_request:
    paths:
      - "web/**"
      - "CURRENT_STATE.md"
      - "FOUNDATION_RECOVERY_PLAN.md"
      - ".github/workflows/primeestate-web-quality.yml"
      - ".github/workflows/production-auth-smoke.yml"

jobs:
  web-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primeestate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d primeestate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/primeestate_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/primeestate_shadow?schema=public
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create Prisma shadow database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d primeestate_ci -c "CREATE DATABASE primeestate_shadow;"

      - name: Migration parity
        run: npm run db:migration:check

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
