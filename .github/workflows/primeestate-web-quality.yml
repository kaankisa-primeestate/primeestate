name: PrimeEstate Web Quality

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/primeestate-web-quality.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/primeestate-web-quality.yml"

jobs:
  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Migration parity
        run: npm run db:migration:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
